---
name: CI Pipeline

"on":
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    name: Code Quality & Typecheck
    runs-on: ubuntu-latest

    env:
      # yamllint disable-line rule:line-length
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5433/mindspace?schema=public"
      BETTER_AUTH_SECRET: "test-secret-value-for-ci-minimum-32-chars-long"
      BETTER_AUTH_URL: "http://localhost:3000"

    steps:
      - name: Checkout repository
        # yamllint disable-line rule:line-length
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        # yamllint disable-line rule:line-length
        uses: actions/setup-node@1e60f63d7bc0455788d90f937143e9be0880287e # v4.2.0
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run TypeScript typecheck (Zero-Error Policy)
        run: npx tsc --noEmit

      - name: Run Unit Tests
        run: npm test

      - name: Run Build
        run: npm run build
