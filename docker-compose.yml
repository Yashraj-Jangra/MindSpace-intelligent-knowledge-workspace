version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mindspace-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: mindspace_db
      POSTGRES_USER: mindspace_user
      POSTGRES_PASSWORD: mindspace_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  minio:
    image: minio/minio:latest
    container_name: mindspace-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: always

volumes:
  postgres_data:
  minio_data:
